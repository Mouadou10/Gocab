<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Muse Personal Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; background: #0d2830; overflow: hidden; user-select: none; color: #f4f9fa; padding: 0; }
    .shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 85% 20%, rgba(20, 150, 170, 0.45), transparent 55%),
                  linear-gradient(135deg, #133b46 0%, #0b232b 60%, #07171c 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 16px;
      padding: 14px 16px;
      gap: 12px;
    }
    .top-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      -webkit-app-region: drag;
    }
    .no-drag { -webkit-app-region: no-drag; }
    .avatar-box {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: linear-gradient(145deg, #070d10, #132229);
      border: 2px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }
    .avatar-box:hover { transform: scale(1.04); }
    .avatar-box.listening {
      border-color: #14e8e8;
      animation: pulseCyan 1.2s infinite;
    }
    .avatar-box.working {
      border-color: #fbbf24;
      animation: pulseAmber 0.9s infinite;
    }
    .avatar-box.error { border-color: #f87171; }
    @keyframes pulseCyan {
      0%, 100% { box-shadow: 0 0 0 0 rgba(20, 232, 232, 0.55); }
      50% { box-shadow: 0 0 0 9px rgba(20, 232, 232, 0); }
    }
    @keyframes pulseAmber {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.55); }
      50% { box-shadow: 0 0 0 9px rgba(251, 191, 36, 0); }
    }
    .info-col { flex: 1; min-width: 0; padding-top: 2px; }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .name { font-size: 16px; font-weight: 700; color: #ffffff; letter-spacing: -0.2px; }
    .subtitle { font-size: 12px; color: #9fb8bf; margin-top: 1px; font-weight: 500; }
    .desc {
      font-size: 11px;
      color: #82a0a8;
      margin-top: 5px;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .status-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #1ed760;
      color: #052611;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(30, 215, 96, 0.35);
    }
    .status-dot.listening { background: #14e8e8; color: #04282b; }
    .status-dot.working { background: #fbbf24; color: #2d1b00; }
    .status-dot.error { background: #ef4444; color: #fff; }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .icon-group { display: flex; align-items: center; gap: 8px; }
    .circle-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.14);
      color: #e6f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .circle-btn:hover { background: rgba(255, 255, 255, 0.24); }
    .circle-btn:active { transform: scale(0.92); }
    .circle-btn.active {
      background: #e6f2f5;
      color: #0b2229;
      border-color: #ffffff;
    }
    .listen-pill {
      height: 34px;
      padding: 0 16px;
      border-radius: 999px;
      border: none;
      background: #14e0e0;
      color: #04262b;
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(20, 224, 224, 0.35);
      transition: transform 0.12s, background 0.15s;
    }
    .listen-pill:hover { background: #2cf0f0; }
    .listen-pill:active { transform: scale(0.96); }
    .listen-pill.listening {
      background: #1ed760;
      color: #042611;
      box-shadow: 0 4px 16px rgba(30, 215, 96, 0.45);
    }

    .drawer {
      display: none;
      flex: 1;
      flex-direction: column;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      gap: 8px;
      overflow: hidden;
    }
    .drawer.open { display: flex; }
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #9fb8bf;
    }
    .badge { background: rgba(20, 224, 224, 0.16); color: #67f3f3; padding: 2px 8px; border-radius: 999px; font-weight: 700; }
    .clear-btn { background: none; border: none; color: #9fb8bf; font-size: 10px; cursor: pointer; text-decoration: underline; }
    .log {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 4px;
      user-select: text;
    }
    .msg { padding: 8px 11px; border-radius: 14px; font-size: 12px; line-height: 1.4; max-width: 90%; }
    .msg.user { align-self: flex-end; background: #14e0e0; color: #04262b; font-weight: 600; }
    .msg.ai { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: #f4f9fa; }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 8px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
    }
    .input-row input:focus { border-color: #14e0e0; }
    .send-btn {
      padding: 0 14px;
      border-radius: 14px;
      border: none;
      background: #14e0e0;
      color: #04262b;
      font-weight: 800;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="top-row">
      <div id="avatarBtn" class="avatar-box no-drag" title="Click to change avatar">🤖</div>
      <div class="info-col">
        <div class="title-row">
          <div>
            <div class="name">Muse AI</div>
            <div id="subtitleText" class="subtitle">Ready • Screen &amp; PC Control</div>
          </div>
          <div id="statusDot" class="status-dot" title="Status">✓</div>
        </div>
        <div id="statusText" class="desc">Click Listening or press Alt+M to speak a task. Muse can see your screen and click for you.</div>
      </div>
    </div>

    <div class="controls-row no-drag">
      <div class="icon-group">
        <button id="watchBtn" class="circle-btn" title="Follow my clicks &amp; screen">👁️</button>
        <button id="screenBtn" class="circle-btn" title="Inspect current screen now">🖥️</button>
        <button id="expandBtn" class="circle-btn" title="Open command drawer">💬</button>
        <button id="closeBtn" class="circle-btn" title="Close Muse">✕</button>
      </div>
      <button id="micBtn" class="listen-pill" title="Click to talk (Alt+M)">
        <span id="micIcon">🎙️</span>
        <span id="micLabel">Listening</span>
      </button>
    </div>

    <div id="drawer" class="drawer no-drag">
      <div class="meta-bar">
        <span id="ctxBadge" class="badge">Context: 0/6 turns · 0 tok</span>
        <button id="clearBtn" class="clear-btn">Reset memory</button>
      </div>
      <div id="log" class="log"></div>
      <form id="askForm" class="input-row">
        <input id="askInput" type="text" placeholder="Type or speak a task for Muse..." />
        <button type="submit" class="send-btn">Send</button>
      </form>
    </div>
  </div>

  <script>
    const AVATARS = ["🤖", "🦊", "⚡", "🧠", "🦁", "🚀"];
    let avatarIdx = 0;
    let expanded = false;
    let listening = false;
    let followClicks = false;
    let recognition = null;

    const avatarBtn = document.getElementById("avatarBtn");
    const subtitleText = document.getElementById("subtitleText");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const watchBtn = document.getElementById("watchBtn");
    const screenBtn = document.getElementById("screenBtn");
    const micBtn = document.getElementById("micBtn");
    const micLabel = document.getElementById("micLabel");
    const expandBtn = document.getElementById("expandBtn");
    const closeBtn = document.getElementById("closeBtn");
    const drawer = document.getElementById("drawer");
    const ctxBadge = document.getElementById("ctxBadge");
    const clearBtn = document.getElementById("clearBtn");
    const logEl = document.getElementById("log");
    const askForm = document.getElementById("askForm");
    const askInput = document.getElementById("askInput");

    function setVisualState(state, detail) {
      avatarBtn.classList.remove("listening", "working", "error");
      statusDot.classList.remove("listening", "working", "error");
      if (state === "listening") {
        avatarBtn.classList.add("listening");
        statusDot.classList.add("listening");
        statusDot.textContent = "●";
        avatarBtn.textContent = "🎙️";
        subtitleText.textContent = "Listening to your voice...";
        micBtn.classList.add("listening");
        micLabel.textContent = "Listening...";
      } else if (state === "working") {
        avatarBtn.classList.add("working");
        statusDot.classList.add("working");
        statusDot.textContent = "⚡";
        avatarBtn.textContent = "⚡";
        subtitleText.textContent = "Working on your PC...";
        micBtn.classList.remove("listening");
        micLabel.textContent = "Listening";
      } else if (state === "error") {
        avatarBtn.classList.add("error");
        statusDot.classList.add("error");
        statusDot.textContent = "!";
        avatarBtn.textContent = "⚠️";
        subtitleText.textContent = "Attention needed";
        micBtn.classList.remove("listening");
        micLabel.textContent = "Listening";
      } else {
        avatarBtn.textContent = AVATARS[avatarIdx];
        statusDot.textContent = "✓";
        subtitleText.textContent = followClicks ? "Watching clicks • Ready" : "Ready • Screen & PC Control";
        micBtn.classList.remove("listening");
        micLabel.textContent = "Listening";
      }
      if (detail) statusText.textContent = detail;
    }

    function appendMsg(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    }

    async function runPrompt(prompt) {
      if (!prompt.trim()) return;
      appendMsg("user", prompt);
      setVisualState("working", "Running: " + prompt);
      const r = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const res = await r.json();
      if (res.ok) {
        appendMsg("ai", res.reply);
        ctxBadge.textContent = `Context: ${res.turns}/${res.maxTurns} turns · ${res.totalTokensUsed} tok`;
        setVisualState("idle", res.reply);
        speak(res.reply);
      } else {
        appendMsg("ai", "Error: " + res.error);
        setVisualState("error", res.error);
      }
    }

    function toggleMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        setVisualState("error", "SpeechRecognition unavailable; type in drawer");
        if (!expanded) toggleExpand(true);
        return;
      }
      if (listening && recognition) {
        recognition.stop();
        listening = false;
        setVisualState("idle", "Click Listening or press Alt+M to speak.");
        return;
      }
      recognition = new SR();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      listening = true;
      setVisualState("listening", "Speak your task now...");
      recognition.onresult = (e) => {
        const transcript = e.results?.[0]?.[0]?.transcript || "";
        listening = false;
        if (transcript) runPrompt(transcript);
      };
      recognition.onerror = () => {
        listening = false;
        setVisualState("idle", "Didn't catch that — click Listening again.");
      };
      recognition.onend = () => {
        if (listening) {
          listening = false;
          setVisualState("idle");
        }
      };
      recognition.start();
    }

    function toggleExpand(forceState) {
      expanded = typeof forceState === "boolean" ? forceState : !expanded;
      drawer.classList.toggle("open", expanded);
      expandBtn.classList.toggle("active", expanded);
      try {
        window.resizeTo(456, expanded ? 460 : 195);
      } catch {}
    }

    avatarBtn.addEventListener("click", () => {
      avatarIdx = (avatarIdx + 1) % AVATARS.length;
      setVisualState("idle");
    });
    watchBtn.addEventListener("click", async () => {
      followClicks = !followClicks;
      await fetch("/api/follow-clicks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ enabled: followClicks }),
      });
      watchBtn.classList.toggle("active", followClicks);
      setVisualState("idle", followClicks ? "Tracking your clicks and active windows." : "Click tracking paused.");
    });
    screenBtn.addEventListener("click", () => {
      runPrompt("Look at my current screen and briefly tell me what is open.");
    });
    micBtn.addEventListener("click", toggleMic);
    expandBtn.addEventListener("click", () => toggleExpand());
    closeBtn.addEventListener("click", () => window.close());
    clearBtn.addEventListener("click", async () => {
      await fetch("/api/clear", { method: "POST" });
      logEl.innerHTML = "";
      ctxBadge.textContent = "Context: 0/6 turns · 0 tok";
      setVisualState("idle", "Memory cleared.");
    });
    askForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = askInput.value.trim();
      if (!val) return;
      askInput.value = "";
      runPrompt(val);
    });

    setInterval(async () => {
      if (listening) return;
      try {
        const r = await fetch("/api/status");
        const s = await r.json();
        if (s.state === "working") setVisualState("working", s.detail);
      } catch {}
    }, 1200);
  </script>
</body>
</html>
