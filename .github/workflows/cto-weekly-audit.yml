name: CTO Engineering Squad — Weekly Automated Audit

on:
  schedule:
    # Runs automatically once per week every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cto-weekly-audit:
    name: Full Codebase & Workflow Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Senior QA & Backend — TypeScript Typecheck (tsc --noEmit)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit 2>&1 | tee tsc-output.log

      - name: CTO Squad — Full CRM Workflow & Schema Parity Audit
        id: workflow_audit
        continue-on-error: true
        env:
          CI: "true"
        run: node --import tsx .agents/skills/cto-engineering-squad/scripts/audit-crm-workflows.ts --ci 2>&1 | tee audit-output.log

      - name: Fail & Notify CTO Squad on Errors
        if: steps.typecheck.outcome == 'failure' || steps.workflow_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tscLog = fs.existsSync('tsc-output.log') ? fs.readFileSync('tsc-output.log', 'utf8').slice(0, 15000) : '';
            const auditLog = fs.existsSync('audit-output.log') ? fs.readFileSync('audit-output.log', 'utf8').slice(0, 15000) : '';
            const body = [
              '## 🚨 CTO Engineering Squad — Weekly Automated Audit Alert',
              '',
              'The automated weekly codebase check detected one or more issues requiring the appropriate Dev Agent:',
              '',
              `- **TypeScript Check (\`tsc --noEmit\`)**: \`${{ steps.typecheck.outcome }}\``,
              `- **CRM Workflow & Schema Audit**: \`${{ steps.workflow_audit.outcome }}\``,
              '',
              '### TypeScript Output',
              '```',
              tscLog || 'No TypeScript errors.',
              '```',
              '',
              '### CTO Workflow & Schema Audit Output',
              '```',
              auditLog || 'No audit output.',
              '```',
              '',
              '### Squad Action Protocol',
              '1. Route `BACKEND_API` / `DATABASE` issues to **Senior Backend Engineer**.',
              '2. Route `FRONTEND_UI` issues to **Senior Frontend Engineer**.',
              '3. Route `DEVOPS_SYNC` issues to **Senior DevOps / Docker / K8s Engineer**.',
              '4. Fix technical/schema/sync bugs while preserving core CRM business logic, record in `MEMORY.md`, and auto-deploy.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [CTO Squad Weekly Audit] Automated Check Failed (${new Date().toISOString().slice(0, 10)})`,
              body,
            });
            core.setFailed('CTO Engineering Squad weekly audit detected errors.');
