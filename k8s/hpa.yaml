apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gocab-crm-hpa
  namespace: gocab
  labels:
    app.kubernetes.io/name: gocab-crm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gocab-crm-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
