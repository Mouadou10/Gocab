apiVersion: apps/v1
kind: Deployment
metadata:
  name: gocab-crm-deployment
  namespace: gocab
  labels:
    app.kubernetes.io/name: gocab-crm
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: gocab-erp
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gocab-crm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gocab-crm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: gocab-crm
          image: gocab/crm:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: gocab-crm-config
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gocab-crm-secrets
                  key: auth-secret
                  optional: true
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gocab-crm-secrets
                  key: nextauth-secret
                  optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
