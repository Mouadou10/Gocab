apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gocab-crm-ingress
  namespace: gocab
  labels:
    app.kubernetes.io/name: gocab-crm
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - crm.gocab.ma
        - gocab-iota.vercel.app
      secretName: gocab-crm-tls
  rules:
    - host: crm.gocab.ma
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gocab-crm-service
                port:
                  number: 80
